<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample-3Dmodel</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</head>

<body>
    <!--
        ========== メモ ===========
        こちらは <model-viewer> のサンプルです。
        ==========================
    <model-viewer 
        class="model"  
        src="shimadasama/3dmodel/shimada-light2.glb"  // 3Dモデルのパスを指定
        camera-controls  // ユーザー操作を有効化
        auto-rotate  // 自動回転を有効化
        interaction-prompt="none"  // インタラクションプロンプト(指マーク)を非表示
        rotation-per-second="30deg"  // 回転速度を指定
        disable-pan // パン操作を無効化
        environment-image="shimadasama/3dmodel/Untitled.hdr" exposure="2.5">  // 環境マップと露出を指定(ライト効果)
    </model-viewer>
    -->
<section class="model-viewer">
    <h1 class="model-viewer__title font-color">3D model</h1>  
    
    <section class="model-viewer__inner">
        <h2 class="model-viewer__section-title font-color">light-glod-24金</h2>
        <div class="model-viewer__conteiner">
            <div class="model-viewer__box">
                <div class="subtitle font-color">修正前</div>
                <div class="model-viewer__canvas">
                    <canvas 
                    id="three-canvas2"
                    class="three-canvas-simple1"
                    data-model-url="shimadasama/complate/old/light-gold24_clrea.glb"
                    data-model-type="bangle_light"
                    ></canvas>
                </div>
            </div>

            <div class="model-viewer__box">
                <div class="subtitle font-color">修正後</div>
                <div class="model-viewer__canvas">
                    <canvas
                    id="three-canvas3"
                    class="three-canvas-simple1"
                    data-model-url="shimadasama/complate/light-gold24_clrea.glb"
                    data-model-type="bangle_light"
                    ></canvas>
                </div>
            </div>

        </div>
    </section>
    
    <section class="model-viewer__inner">
        <h2 class="model-viewer__section-title font-color">light-glod-10金</h2>
        <div class="model-viewer__conteiner">
            <div class="model-viewer__box">
                <div class="subtitle font-color">修正前</div>
                <div class="model-viewer__canvas">
                    <canvas 
                    id="three-canvas2"
                    class="three-canvas-simple1"
                    data-model-url="shimadasama/complate/old/light-gold10.glb"
                    data-model-type="bangle_light"
                    ></canvas>
                </div>
            </div>

            <div class="model-viewer__box">
                <div class="subtitle font-color">修正後</div>
                <div class="model-viewer__canvas">
                    <canvas
                    id="three-canvas3"
                    class="three-canvas-simple1"
                    data-model-url="shimadasama/complate/light-gold10.glb"
                    data-model-type="bangle_light"
                    ></canvas>
                </div>
            </div>

        </div>
    </section>
    
    <section class="model-viewer__inner">
        <h2 class="model-viewer__section-title font-color">light-bitter-gold</h2>
        <div class="model-viewer__conteiner">
            <div class="model-viewer__box">
                <div class="subtitle font-color">修正前</div>
                <div class="model-viewer__canvas">
                    <canvas 
                    id="three-canvas2"
                    class="three-canvas-simple1"
                    data-model-url="shimadasama/complate/old/light-brack.glb"
                    data-model-type="bangle_light"
                    ></canvas>
                </div>
            </div>

            <div class="model-viewer__box">
                <div class="subtitle font-color">修正後</div>
                <div class="model-viewer__canvas">
                    <canvas
                    id="three-canvas3"
                    class="three-canvas-simple1"
                    data-model-url="shimadasama/complate/light-brack.glb"
                    data-model-type="bangle_light"
                    ></canvas>
                </div>
            </div>

        </div>
    </section>

</section>
<!-- <script type="module" src="js/main.js"></script> -->
<script type="module" src="js/main-copy1.js"></script>
</body>

</html>
