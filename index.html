<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample-3Dmodel</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

</head>

<body>
    <h1 class="title">3D model</h1>    
    <!--
        ========== メモ ===========
        こちらは <model-viewer> のサンプルです。
        ==========================
    <model-viewer 
        class="model"  
        src="shimadasama/3dmodel/shimada-light2.glb"  // 3Dモデルのパスを指定
        camera-controls  // ユーザー操作を有効化
        auto-rotate  // 自動回転を有効化
        interaction-prompt="none"  // インタラクションプロンプト(指マーク)を非表示
        rotation-per-second="30deg"  // 回転速度を指定
        disable-pan // パン操作を無効化
        environment-image="shimadasama/3dmodel/Untitled.hdr" exposure="2.5">  // 環境マップと露出を指定(ライト効果)
    </model-viewer>
    -->
<section>

    <div class="divbox">

        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / bold</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>glod-18金</dd>
            </div>
        </dl>
        <canvas 
        id="three-canvas2"
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/bold-gold18.glb"
        data-model-type="bangle_bold"
        ></canvas>
        
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>ring</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>bitter_gold</dd>
            </div>
        </dl>
        <canvas
        id="three-canvas3"
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/ring-brack.glb"
        data-model-type="ring"
        ></canvas>
    
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / EX_bold</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>silver</dd>
            </div>
        </dl>
        <canvas
        id="three-canvas4"
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/EX-bold-silver.glb"
        data-model-type="bangle_ex_bold"
        ></canvas>
    
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / light</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>silver</dd>
            </div>
        </dl>
        <canvas
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/light-silver.glb"
        data-model-type="bangle"
        ></canvas>
        
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / light</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>gold24 金</dd>
            </div>
        </dl>
        <canvas
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/light-gold24.glb"
        data-model-type="bangle"
        ></canvas>
    
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / light</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>gold18 金</dd>
            </div>
        </dl>
        <canvas
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/light-gold18.glb"
        data-model-type="bangle"
        ></canvas>
        
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / light</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>gold10 金</dd>
            </div>
        </dl>
        <canvas
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/light-gold10.glb"
        data-model-type="bangle"
        ></canvas>
        
        <dl class="dl_flex">
            <div class="dl_flex-item">
                <dt>type：</dt>
                <dd>bangle / light</dd>
            </div>
            <div class="dl_flex-item">
                <dt>color：</dt>
                <dd>bitter_gold</dd>
            </div>
        </dl>
        <canvas
        class="three-canvas-simple1"
        data-model-url="shimadasama/complate/light-brack.glb"
        data-model-type="bangle"
        ></canvas>
    
        <script type="module" src="js/main-copy1.js"></script>
    </div>
</section>
</body>

</html>
